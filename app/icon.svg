<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon. The tile is filled edge to edge on purpose: Google and most
    browsers crop a favicon to a circle, so a mark floating on transparency
    comes out as a small shape inside a white ring. Filling it makes the tile
    itself the planet, and the orbit reads at 16px where a thin ring would not.
    Colours are literal, not tokens: nothing here inherits the page CSS.
  -->
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#2a2663"/>
      <stop offset="100%" stop-color="#0d0b21"/>
    </radialGradient>
    <linearGradient id="ring" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#2F68BB"/>
      <stop offset="60%" stop-color="#6f9fe0"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="url(#body)"/>

  <g transform="rotate(-38 16 16)">
    <!-- Far half, dimmed, so the line reads as a ring going round rather
         than a swoosh lying on top. -->
    <path d="M 31 16 A 15 5 0 0 0 1 16" fill="none"
          stroke="url(#ring)" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>
    <path d="M 31 16 A 15 5 0 0 1 1 16" fill="none"
          stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <path d="M 25.6 6.4 Q 26.1 8.3 28.1 8.8 Q 26.1 9.3 25.6 11.2 Q 25.1 9.3 23.1 8.8 Q 25.1 8.3 25.6 6.4 Z"
        fill="#C4B5FD"/>
</svg>
